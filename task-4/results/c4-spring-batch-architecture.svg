<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
  <style>
    .boundary{fill:none;stroke:#8092a8;stroke-width:2;stroke-dasharray:8 5;rx:14}
    .person{fill:#fff7e6;stroke:#9a6b19;stroke-width:2;rx:10}
    .container{fill:#eaf4e4;stroke:#3d7a38;stroke-width:2;rx:10}
    .db{fill:#f5f9ff;stroke:#2f5f98;stroke-width:2;rx:10}
    .external{fill:#f6edff;stroke:#7048a8;stroke-width:2;rx:10}
    .text{font-family:Arial,sans-serif;font-size:15px;fill:#1d2733}
    .title{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#1d2733}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#4a5568}
    .arrow{stroke:#4a5568;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .label{font-family:Arial,sans-serif;font-size:12px;fill:#4a5568}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs>
  <text x="30" y="35" class="title">C4 Container — TradeWare ETL со Spring Batch</text>

  <rect x="35" y="70" width="1210" height="655" class="boundary"/>
  <text x="55" y="96" class="small">TradeWare system boundary — переходная архитектура рядом с монолитом</text>

  <rect x="70" y="130" width="190" height="100" class="person"/>
  <text x="165" y="165" text-anchor="middle" class="text">Сотрудник склада</text>
  <text x="165" y="188" text-anchor="middle" class="small">загружает CSV и</text>
  <text x="165" y="205" text-anchor="middle" class="small">смотрит статус обработки</text>

  <rect x="330" y="115" width="250" height="115" class="container"/>
  <text x="455" y="150" text-anchor="middle" class="text">ERP Monolith UI/API</text>
  <text x="455" y="173" text-anchor="middle" class="small">Java 11 / WildFly</text>
  <text x="455" y="193" text-anchor="middle" class="small">принимает файл, сохраняет raw,</text>
  <text x="455" y="210" text-anchor="middle" class="small">регистрирует ingestion job</text>

  <rect x="330" y="330" width="250" height="115" class="container"/>
  <text x="455" y="365" text-anchor="middle" class="text">Job Dispatcher / Queue</text>
  <text x="455" y="388" text-anchor="middle" class="small">таблица ingestion_job</text>
  <text x="455" y="408" text-anchor="middle" class="small">или Pub/Sub / очередь сообщений</text>

  <rect x="670" y="115" width="280" height="145" class="container"/>
  <text x="810" y="150" text-anchor="middle" class="text">Inventory Batch Worker</text>
  <text x="810" y="173" text-anchor="middle" class="small">Spring Batch, horizontally scaled containers</text>
  <text x="810" y="196" text-anchor="middle" class="small">validate → enrich → stage → merge → finalize</text>
  <text x="810" y="216" text-anchor="middle" class="small">retry / skip / restart / quarantine</text>
  <text x="810" y="238" text-anchor="middle" class="small">Micrometer metrics + structured logs</text>

  <rect x="1020" y="105" width="180" height="90" class="external"/>
  <text x="1110" y="140" text-anchor="middle" class="text">Google Cloud Storage</text>
  <text x="1110" y="163" text-anchor="middle" class="small">raw/, quarantine/,</text>
  <text x="1110" y="180" text-anchor="middle" class="small">processed/ CSV files</text>

  <rect x="1020" y="260" width="180" height="120" class="db"/>
  <text x="1110" y="295" text-anchor="middle" class="text">PostgreSQL</text>
  <text x="1110" y="318" text-anchor="middle" class="small">inventory tables</text>
  <text x="1110" y="338" text-anchor="middle" class="small">staging + reference data</text>
  <text x="1110" y="358" text-anchor="middle" class="small">Spring Batch Job Repository</text>

  <rect x="670" y="360" width="280" height="95" class="db"/>
  <text x="810" y="393" text-anchor="middle" class="text">Job Status / Error Audit</text>
  <text x="810" y="416" text-anchor="middle" class="small">статусы, строки, причины ошибок,</text>
  <text x="810" y="433" text-anchor="middle" class="small">ссылки на quarantine-файлы</text>

  <rect x="330" y="535" width="250" height="95" class="container"/>
  <text x="455" y="568" text-anchor="middle" class="text">Notification Service</text>
  <text x="455" y="591" text-anchor="middle" class="small">UI/email/webhook уведомления</text>
  <text x="455" y="608" text-anchor="middle" class="small">о результате обработки</text>

  <rect x="700" y="535" width="250" height="95" class="external"/>
  <text x="825" y="568" text-anchor="middle" class="text">Monitoring / Logging</text>
  <text x="825" y="591" text-anchor="middle" class="small">Prometheus/Grafana + centralized logs</text>
  <text x="825" y="608" text-anchor="middle" class="small">alerts on failed/late/backlog</text>

  <path d="M260 175 L330 175" class="arrow"/>
  <text x="265" y="165" class="label">upload/status</text>
  <path d="M580 160 C620 150 630 145 670 145" class="arrow"/>
  <text x="592" y="140" class="label">async job trigger</text>
  <path d="M580 205 C650 250 650 350 670 380" class="arrow"/>
  <text x="610" y="275" class="label">registers job</text>
  <path d="M580 390 L670 390" class="arrow"/>
  <text x="595" y="380" class="label">claim job</text>
  <path d="M950 150 L1020 150" class="arrow"/>
  <text x="960" y="140" class="label">read/write files</text>
  <path d="M950 230 C980 245 990 275 1020 300" class="arrow"/>
  <text x="955" y="252" class="label">batch write / merge</text>
  <path d="M810 260 L810 360" class="arrow"/>
  <text x="820" y="315" class="label">status + errors</text>
  <path d="M670 405 C620 430 590 520 580 570" class="arrow"/>
  <text x="585" y="500" class="label">completion event</text>
  <path d="M330 580 C260 560 220 300 190 230" class="arrow"/>
  <text x="205" y="430" class="label">notify result</text>
  <path d="M810 455 L810 535" class="arrow"/>
  <text x="820" y="500" class="label">metrics/logs</text>

  <text x="55" y="705" class="small">Ключевое изменение: HTTP-загрузка больше не ждет обработку. Монолит быстро регистрирует задание, а выделенные Spring Batch workers обрабатывают файл чанками с retry/restart, staging и set-based merge.</text>
</svg>
