services:
  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: msa5-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  airflow-init:
    image: apache/airflow:2.9.3
    container_name: msa5-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/sqlite/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__SMTP__SMTP_HOST: mailpit
      AIRFLOW__SMTP__SMTP_PORT: "1025"
      AIRFLOW__SMTP__SMTP_STARTTLS: "false"
      AIRFLOW__SMTP__SMTP_SSL: "false"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.local
      POC_ROW_THRESHOLD: "5"
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./output:/opt/airflow/output
      - ./sqlite:/opt/airflow/sqlite
    user: "50000:0"
    command: >
      bash -c "mkdir -p /opt/airflow/sqlite && airflow db init &&
      (airflow users create --username admin --password \"$${AIRFLOW_ADMIN_PASSWORD}\"
      --firstname Admin --lastname User --role Admin --email admin@example.local || true)"

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: msa5-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/sqlite/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__SMTP__SMTP_HOST: mailpit
      AIRFLOW__SMTP__SMTP_PORT: "1025"
      AIRFLOW__SMTP__SMTP_STARTTLS: "false"
      AIRFLOW__SMTP__SMTP_SSL: "false"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.local
      POC_ROW_THRESHOLD: "5"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./output:/opt/airflow/output
      - ./sqlite:/opt/airflow/sqlite
    user: "50000:0"
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: msa5-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/sqlite/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__SMTP__SMTP_HOST: mailpit
      AIRFLOW__SMTP__SMTP_PORT: "1025"
      AIRFLOW__SMTP__SMTP_STARTTLS: "false"
      AIRFLOW__SMTP__SMTP_SSL: "false"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.local
      POC_ROW_THRESHOLD: "5"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./output:/opt/airflow/output
      - ./sqlite:/opt/airflow/sqlite
    user: "50000:0"
    command: scheduler
