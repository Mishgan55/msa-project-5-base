apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipment-exporter
  namespace: logistics-export
  labels:
    app.kubernetes.io/name: shipment-exporter
spec:
  schedule: "0 20 * * *"
  timeZone: Europe/Moscow
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shipment-exporter
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: exporter
              image: shipment-exporter:local
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: shipment-exporter-config
              env:
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: shipment-exporter-auth
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: shipment-exporter-auth
                      key: DB_PASSWORD
              volumeMounts:
                - name: exports
                  mountPath: /exports
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: exports
              persistentVolumeClaim:
                claimName: analytics-exports
            - name: tmp
              emptyDir: {}
