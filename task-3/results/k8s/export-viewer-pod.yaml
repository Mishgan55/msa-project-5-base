apiVersion: v1
kind: Pod
metadata:
  name: export-viewer
  namespace: logistics-export
  labels:
    app.kubernetes.io/name: export-viewer
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: viewer
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: exports
          mountPath: /exports
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: exports
      persistentVolumeClaim:
        claimName: analytics-exports
