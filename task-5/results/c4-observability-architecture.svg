<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <style>
    .boundary{fill:none;stroke:#8092a8;stroke-width:2;stroke-dasharray:8 5;rx:14}
    .person{fill:#fff7e6;stroke:#9a6b19;stroke-width:2;rx:10}
    .container{fill:#eaf4e4;stroke:#3d7a38;stroke-width:2;rx:10}
    .db{fill:#f5f9ff;stroke:#2f5f98;stroke-width:2;rx:10}
    .obs{fill:#f6edff;stroke:#7048a8;stroke-width:2;rx:10}
    .text{font-family:Arial,sans-serif;font-size:15px;fill:#1d2733}
    .title{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#1d2733}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#4a5568}
    .arrow{stroke:#4a5568;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .label{font-family:Arial,sans-serif;font-size:12px;fill:#4a5568}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs>
  <text x="30" y="35" class="title">C4 Container — TradeWare batch processing + monitoring/logging/alerting</text>

  <rect x="35" y="70" width="1330" height="735" class="boundary"/>
  <text x="55" y="96" class="small">TradeWare target architecture</text>

  <rect x="70" y="130" width="180" height="95" class="person"/>
  <text x="160" y="163" text-anchor="middle" class="text">Сотрудник склада</text>
  <text x="160" y="186" text-anchor="middle" class="small">загружает CSV</text>
  <text x="160" y="203" text-anchor="middle" class="small">и получает статус</text>

  <rect x="320" y="115" width="240" height="115" class="container"/>
  <text x="440" y="150" text-anchor="middle" class="text">ERP Monolith UI/API</text>
  <text x="440" y="173" text-anchor="middle" class="small">Java 11 / WildFly</text>
  <text x="440" y="193" text-anchor="middle" class="small">accept file + register job</text>
  <text x="440" y="213" text-anchor="middle" class="small">trace_id / job_id propagation</text>

  <rect x="640" y="105" width="290" height="140" class="container"/>
  <text x="785" y="140" text-anchor="middle" class="text">Inventory Batch Worker</text>
  <text x="785" y="163" text-anchor="middle" class="small">Spring Batch, horizontally scaled</text>
  <text x="785" y="186" text-anchor="middle" class="small">validate → enrich → stage → merge → finalize</text>
  <text x="785" y="209" text-anchor="middle" class="small">Micrometer /actuator/prometheus</text>
  <text x="785" y="229" text-anchor="middle" class="small">structured JSON logs to stdout</text>

  <rect x="1010" y="100" width="180" height="90" class="db"/>
  <text x="1100" y="135" text-anchor="middle" class="text">PostgreSQL</text>
  <text x="1100" y="158" text-anchor="middle" class="small">inventory + staging</text>
  <text x="1100" y="175" text-anchor="middle" class="small">job repository</text>

  <rect x="1010" y="235" width="180" height="85" class="db"/>
  <text x="1100" y="268" text-anchor="middle" class="text">GCS</text>
  <text x="1100" y="291" text-anchor="middle" class="small">raw / processed /</text>
  <text x="1100" y="308" text-anchor="middle" class="small">quarantine files</text>

  <rect x="330" y="330" width="230" height="90" class="container"/>
  <text x="445" y="363" text-anchor="middle" class="text">Job Dispatcher / Queue</text>
  <text x="445" y="386" text-anchor="middle" class="small">ingestion_job table</text>
  <text x="445" y="403" text-anchor="middle" class="small">or Pub/Sub</text>

  <rect x="640" y="340" width="290" height="90" class="container"/>
  <text x="785" y="373" text-anchor="middle" class="text">Notification Service</text>
  <text x="785" y="396" text-anchor="middle" class="small">UI/email/webhook status</text>
  <text x="785" y="413" text-anchor="middle" class="small">success / failure / quarantine</text>

  <rect x="70" y="520" width="270" height="115" class="obs"/>
  <text x="205" y="555" text-anchor="middle" class="text">Prometheus</text>
  <text x="205" y="578" text-anchor="middle" class="small">scrapes /actuator/prometheus,</text>
  <text x="205" y="598" text-anchor="middle" class="small">Kubernetes, postgres exporter</text>
  <text x="205" y="618" text-anchor="middle" class="small">stores batch/service metrics</text>

  <rect x="390" y="520" width="230" height="115" class="obs"/>
  <text x="505" y="555" text-anchor="middle" class="text">Alertmanager</text>
  <text x="505" y="578" text-anchor="middle" class="small">deduplication, routing,</text>
  <text x="505" y="598" text-anchor="middle" class="small">email/Slack/incident channel</text>
  <text x="505" y="618" text-anchor="middle" class="small">severity-based alerts</text>

  <rect x="680" y="520" width="230" height="115" class="obs"/>
  <text x="795" y="555" text-anchor="middle" class="text">Grafana</text>
  <text x="795" y="578" text-anchor="middle" class="small">operations overview,</text>
  <text x="795" y="598" text-anchor="middle" class="small">SLA, backlog, data quality,</text>
  <text x="795" y="618" text-anchor="middle" class="small">DB/JVM/Kubernetes dashboards</text>

  <rect x="970" y="520" width="180" height="115" class="obs"/>
  <text x="1060" y="555" text-anchor="middle" class="text">Fluent Bit</text>
  <text x="1060" y="578" text-anchor="middle" class="small">collects stdout logs,</text>
  <text x="1060" y="598" text-anchor="middle" class="small">enriches with pod metadata,</text>
  <text x="1060" y="618" text-anchor="middle" class="small">buffers and retries</text>

  <rect x="1190" y="520" width="150" height="115" class="obs"/>
  <text x="1265" y="555" text-anchor="middle" class="text">Elasticsearch</text>
  <text x="1265" y="578" text-anchor="middle" class="small">indexed JSON logs</text>
  <text x="1265" y="598" text-anchor="middle" class="small">retention / ILM</text>
  <text x="1265" y="618" text-anchor="middle" class="small">search by job_id</text>

  <rect x="1060" y="700" width="240" height="75" class="obs"/>
  <text x="1180" y="732" text-anchor="middle" class="text">Kibana</text>
  <text x="1180" y="752" text-anchor="middle" class="small">incident investigation, filtering,</text>
  <text x="1180" y="769" text-anchor="middle" class="small">error-code and trace analysis</text>

  <path d="M250 175 L320 175" class="arrow"/>
  <text x="260" y="165" class="label">upload/status</text>
  <path d="M560 175 L640 175" class="arrow"/>
  <text x="570" y="165" class="label">async job</text>
  <path d="M930 155 L1010 145" class="arrow"/>
  <text x="938" y="140" class="label">batch write/merge</text>
  <path d="M930 210 C970 230 980 250 1010 270" class="arrow"/>
  <text x="943" y="225" class="label">read/write CSV</text>
  <path d="M560 380 L640 380" class="arrow"/>
  <text x="565" y="370" class="label">status event</text>
  <path d="M640 395 C520 450 300 420 200 225" class="arrow"/>
  <text x="355" y="455" class="label">notify user</text>

  <path d="M785 245 C760 360 500 420 320 520" class="arrow"/>
  <text x="520" y="425" class="label">metrics scrape</text>
  <path d="M340 575 L390 575" class="arrow"/>
  <text x="345" y="565" class="label">alerts</text>
  <path d="M620 575 L680 575" class="arrow"/>
  <text x="625" y="565" class="label">alert state</text>
  <path d="M785 430 C825 480 900 500 970 560" class="arrow"/>
  <text x="850" y="495" class="label">stdout JSON</text>
  <path d="M1150 575 L1190 575" class="arrow"/>
  <text x="1155" y="565" class="label">ship logs</text>
  <path d="M1265 635 C1260 680 1240 690 1205 700" class="arrow"/>
  <text x="1200" y="675" class="label">search</text>

  <text x="55" y="835" class="small">Разделение ответственности: Prometheus/Grafana/Alertmanager отвечают за метрики и оповещения; Fluent Bit/Elasticsearch/Kibana — за централизованные логи и расследование инцидентов по trace_id/job_id.</text>
</svg>
